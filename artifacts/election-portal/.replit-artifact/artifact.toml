kind = "web"
previewPath = "/"
title = "India Election Portal"
version = "1.0.0"
id = "artifacts/election-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21815

[services.development]
run = "pnpm --filter @workspace/election-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/election-portal", "run", "build" ]
publicDir = "artifacts/election-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21815"
BASE_PATH = "/"
